version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # One weekly PR for routine version bumps.
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      # Security bumps of transitive dependencies used to arrive as one PR each;
      # batch them so the queue stays reviewable.
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions workflow pinned versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-dependencies:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
