name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: uv sync --all-extras --dev --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: uv sync --all-extras --dev --locked
      - name: Pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --dev --locked
      - name: Run unit tests
        run: uv run pytest -m unit --cov=compactbench --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.xml

  notebook-smoke:
    # Rebuild the Colab notebook from its generator (catches drift), then
    # execute every embedded `compactbench` command against the mock provider.
    # No API keys required — this runs in every PR so notebook regressions
    # can't slip through to users.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install compactbench
        run: uv sync --all-extras --dev --locked
      - name: Regenerate notebook from source of truth
        run: uv run python scripts/build_notebook.py
      - name: Smoke-test notebook commands
        run: uv run python scripts/smoke_notebook.py

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Build distributions
        run: uv build

      # The 0.1.0 wheel shipped with zero benchmark content because the
      # force-include mapping landed after the release tag, so
      # `pip install compactbench && compactbench suites list` exited 1 for
      # every user for four months. Install the built wheel into a clean venv
      # in an empty directory — no repo checkout on the path — and assert the
      # CLI can actually find its data. Cheap, and it makes that class of
      # packaging regression impossible to ship again.
      - name: Smoke-test the built wheel in a clean environment
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          uv venv "$work/venv"
          uv pip install --python "$work/venv/bin/python" dist/*.whl
          cd "$work"
          "$work/venv/bin/compactbench" --version
          out="$("$work/venv/bin/compactbench" suites list)"
          echo "$out"
          for suite in starter elite_practice; do
            echo "$out" | grep -q "$suite" \
              || { echo "::error::built wheel cannot see the '$suite' suite — benchmark content is missing from the distribution"; exit 1; }
          done
          "$work/venv/bin/compactbench" providers list | grep -q openai \
            || { echo "::error::built wheel is missing the openai provider"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
