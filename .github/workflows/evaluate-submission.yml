name: Evaluate submission

# Ranked evaluation of one submission made on compactbench.com. The site starts this
# workflow (workflow_dispatch) with the submission id; no person reviews or merges
# anything.
#
# Trust boundaries:
#
# - The submitted method runs only inside a container: gVisor runtime, no network
#   except the model proxy, read-only filesystem, no privileges, resource limits. It
#   never sees a key, the hidden suite pack, the reader or other cases.
# - Jobs fetch the submission from the site with a GitHub OIDC token; the site only
#   answers this workflow on main in this repository.
# - `build` holds no secrets. `evaluate` holds them in the `ranked-evaluation`
#   environment. `publish` only writes data the evaluation produced, validated first.
# - Sealed traces and raw results never become artifacts: `evaluate` sends them to the
#   site's private archive and only redacted results and the commitment move on.

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: Submission id from compactbench.com
        required: true
        type: string

permissions: {}

concurrency:
  group: evaluate-${{ inputs.submission_id }}
  cancel-in-progress: false

env:
  SUBMISSION_ID: ${{ inputs.submission_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the id
        run: |
          case "$SUBMISSION_ID" in ''|*[!a-z0-9]*) echo "::error::bad submission id"; exit 1;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: harness
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the harness
        working-directory: harness
        run: uv sync --extra providers --extra ranked --locked

      - name: Fetch and validate the submission
        run: |
          uv run --project harness python harness/scripts/ranked/site.py fetch "$SUBMISSION_ID" bundle.json
          uv run --project harness python -m compactbench.submission validate bundle.json
          uv run --project harness python harness/scripts/ranked/site.py status "$SUBMISSION_ID" building

      - name: Build the method image (no secrets present)
        run: |
          mkdir -p ctx/compactbench ctx/submission
          git -C harness archive HEAD | tar -x -C ctx/compactbench
          uv run --project harness python - <<'PY'
          import json, pathlib
          b = json.loads(pathlib.Path("bundle.json").read_text())
          # A reference-method submission has no code: the image runs a built-in.
          pathlib.Path("ctx/submission/method.py").write_text(b.get("method_py") or "")
          if (b.get("requirements") or "").strip():
              pathlib.Path("ctx/submission/requirements.txt").write_text(b["requirements"])
          PY
          cp harness/docker/submission.Dockerfile ctx/Dockerfile
          docker build --pull -t cb-submission ctx
          docker save cb-submission | gzip > submission-image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: submission-image
          path: submission-image.tar.gz
          retention-days: 1

      - name: Report a failed build
        if: failure()
        run: |
          uv run --project harness python harness/scripts/ranked/site.py status "$SUBMISSION_ID" failed \
            "The submission didn't validate or its image didn't build. Check method.py and requirements." || true

  evaluate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ranked-evaluation
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: harness
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the harness
        working-directory: harness
        run: uv sync --extra providers --extra ranked --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submission-image

      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -qq && sudo apt-get install -y -qq runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc

      - name: Load the method image and build the proxy
        run: |
          gunzip -c submission-image.tar.gz | docker load
          mkdir -p proxy-ctx/compactbench
          git -C harness archive HEAD | tar -x -C proxy-ctx/compactbench
          cp harness/docker/proxy.Dockerfile proxy-ctx/Dockerfile
          docker build --pull -t cb-proxy proxy-ctx

      - name: Fetch the hidden suite pack
        env:
          HIDDEN_DEPLOY_KEY: ${{ secrets.HIDDEN_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HIDDEN_DEPLOY_KEY" > ~/.ssh/hidden
          chmod 600 ~/.ssh/hidden
          GIT_SSH_COMMAND="ssh -i ~/.ssh/hidden -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:compactbench/compactbench-hidden.git "$RUNNER_TEMP/hidden"
          rm -f ~/.ssh/hidden

      - name: Run the evaluation
        env:
          COMPACTBENCH_SEASON_PRIVATE_KEY: ${{ secrets.SEASON_S1_PRIVATE_KEY }}
          COMPACTBENCH_TRACE_PUBLIC_KEY: ${{ vars.TRACE_PUBLIC_KEY }}
        run: |
          uv run --project harness python harness/scripts/ranked/site.py fetch "$SUBMISSION_ID" bundle.json
          uv run --project harness python harness/scripts/ranked/site.py status "$SUBMISSION_ID" running
          uv run --project harness python harness/scripts/ranked/evaluate.py \
            --bundle bundle.json \
            --image cb-submission \
            --proxy-image cb-proxy \
            --runtime runsc \
            --season harness/seasons/s1.yaml \
            --suite-pack "$RUNNER_TEMP/hidden/packs/elite_s1/pack.py" \
            --out out
          rm -rf "$RUNNER_TEMP/hidden" bundle.json

      # The sealed traces, raw results and call log go to the site's private archive and
      # are deleted here, whether or not the upload worked: artifacts of a public
      # repository can be downloaded, so only what publish needs is uploaded below.
      - name: Archive the run privately
        run: |
          uv run --project harness python harness/scripts/ranked/site.py archive "$SUBMISSION_ID" out \
            || echo "::warning::some of the run's files weren't archived"
          rm -f out/*.sealed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evaluation
          path: |
            out/results.jsonl
            out/commitment.json
            out/submission.json
          if-no-files-found: error
          retention-days: 1

      - name: Report a failed run
        if: failure()
        run: |
          uv run --project harness python harness/scripts/ranked/site.py status "$SUBMISSION_ID" failed \
            "The ranked run failed. Common causes: a key without credit or access to the model, or the method raising errors." || true

  publish:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds PUBLISH_DEPLOY_KEY, the write deploy key the main-branch ruleset lets through
    # (pushes with the job token are blocked by the pull-request rule). Main only.
    environment: publish
    permissions:
      actions: write  # to start the site deploy
      contents: write
      id-token: write
    # No concurrency group: GitHub keeps only one pending job per group and cancels it when
    # another queues, which would drop a finished run. Publishes run side by side and the
    # push below retries from the latest main instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evaluation
          path: evaluation

      - name: Write the submission into the repository
        id: write
        run: |
          uv run python scripts/ranked/site.py fetch "$SUBMISSION_ID" evaluation/bundle.json
          score="$(uv run python scripts/ranked/publish.py evaluation . --season seasons/s1.yaml)"
          echo "score=$score" >> "$GITHUB_OUTPUT"

      # The leaderboard is rebuilt here and the site deploy started explicitly below. Another
      # publish may push first, so each attempt starts again from the latest main, writes this
      # submission and rebuilds the leaderboard; a push that loses the race tries again.
      - name: Rebuild the leaderboard and commit
        env:
          PUBLISH_DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
        run: |
          trap 'rm -f ~/.ssh/publish evaluation/bundle.json' EXIT
          git config user.name "compactbench-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PUBLISH_DEPLOY_KEY" > ~/.ssh/publish
          chmod 600 ~/.ssh/publish
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/publish -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            uv run python scripts/ranked/publish.py evaluation . --season seasons/s1.yaml > /dev/null
            uv run python scripts/rebuild_leaderboard.py
            git add submissions/ docs/data/leaderboard.json
            if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
            git commit -q -m "chore(leaderboard): publish ranked submission $SUBMISSION_ID"
            if git push git@github.com:${{ github.repository }}.git HEAD:main; then exit 0; fi
            echo "main moved on; retrying ($attempt)"
            sleep $((attempt * 10))
          done
          echo "::error::couldn't push the submission after 6 attempts"
          exit 1

      - name: Deploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main

      - name: Report
        if: always()
        env:
          SCORE: ${{ steps.write.outputs.score }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ] && [ -n "$SCORE" ]; then
            uv run python scripts/ranked/site.py status "$SUBMISSION_ID" published "Published on the leaderboard." --score "$SCORE"
          elif [ -s evaluation/rejection.txt ]; then
            uv run python scripts/ranked/site.py status "$SUBMISSION_ID" rejected \
              "The run finished but didn't qualify: $(head -c 400 evaluation/rejection.txt)" || true
          else
            uv run python scripts/ranked/site.py status "$SUBMISSION_ID" failed \
              "The run finished but couldn't be published; the failure is logged for the maintainers." || true
          fi
