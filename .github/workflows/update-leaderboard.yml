name: Update leaderboard

# Rebuilds docs/data/leaderboard.json when something it depends on changes on main:
# baseline results, a submission, a season file or the ranking code.

on:
  push:
    branches: [main]
    paths:
      - "baselines/**"
      - "submissions/**/results.jsonl"
      - "seasons/**"
      - "src/compactbench/leaderboard/**"
      - "src/compactbench/scoring/**"
  workflow_dispatch:

permissions:
  contents: write  # to commit the rebuilt leaderboard.json

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --extra providers --locked

      - name: Rebuild leaderboard.json
        run: uv run python scripts/rebuild_leaderboard.py

      - name: Commit updated leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/data/leaderboard.json; then
            echo "leaderboard.json unchanged — skipping commit"
            exit 0
          fi
          git add docs/data/leaderboard.json
          git commit -m "chore(leaderboard): rebuild [skip ci]"
          git push
