name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install docs dependencies
        run: uv sync --extra docs --locked
      # Until compactbench.com is live, GitHub Pages serves the MkDocs site. Once the
      # repository variable SITE_LIVE is "true", it serves redirects to compactbench.com
      # instead; MkDocs still builds (strict) so broken links in docs/ fail here.
      - name: Build MkDocs site
        run: uv run mkdocs build --strict
      - name: Build redirect pages
        if: vars.SITE_LIVE == 'true'
        run: uv run python scripts/pages_redirects.py site-redirects
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ vars.SITE_LIVE == 'true' && 'site-redirects/' || 'site/' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
